<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyaitter Management Tool</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="navbar">
      <div class="nav-brand">
        <span class="logo-text">Nyaitter Management Tool</span>
        <span id="server-status-pill" class="status-text">サーバー停止中</span>
      </div>
      <div class="nav-actions">
        <button id="refresh-all-btn" class="btn btn-secondary btn-sm" title="データを再読み込み">更新</button>
        <button id="logout-btn" class="btn btn-secondary btn-sm hidden">ログアウト</button>
      </div>
    </header>

    <!-- タブナビゲーション -->
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="status">
        ステータス
      </button>
      <button class="tab-btn" data-tab="logs">
        ログ
      </button>
      <button class="tab-btn" data-tab="errors">
        エラー
      </button>
      <button class="tab-btn" data-tab="settings">
        設定
      </button>
    </nav>

    <!-- メインコンテンツ -->
    <main class="container">
      <!-- 1. ステータス -->
      <section id="tab-status" class="tab-content active">
        <div class="cards-grid">
          <div class="card">
            <div class="card-header">
              <h3>NyaitterServer</h3>
            </div>
            <div class="card-body">
              <div class="metric-row">
                <span class="metric-label">プロセス状態</span>
                <span id="server-process-status" class="metric-value">停止中</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">プロセスID (PID)</span>
                <span id="server-pid" class="metric-value">-</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">ポート番号</span>
                <span id="server-port" class="metric-value">3000</span>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>NMT</h3>
            </div>
            <div class="card-body">
              <div class="metric-row">
                <span class="metric-label">プロセスID (PID)</span>
                <span id="nmt-pid" class="metric-value">-</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">稼働時間</span>
                <span id="nmt-uptime" class="metric-value">-</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">ポート番号</span>
                <span id="nmt-port" class="metric-value">4040</span>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>データベース</h3>
            </div>
            <div class="card-body">
              <div class="metric-row">
                <span class="metric-label">接続状態</span>
                <span id="db-status" class="metric-value">-</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">エラー情報</span>
                <span id="db-error" class="metric-value text-muted">なし</span>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>システムリソース</h3>
            </div>
            <div class="card-body">
              <div class="metric-row">
                <span class="metric-label">NMT メモリ使用量</span>
                <span id="sys-memory" class="metric-value">- MB</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">NMT CPU 使用率</span>
                <span id="sys-cpu" class="metric-value">- %</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Node バージョン</span>
                <span id="sys-node" class="metric-value">-</span>
              </div>
            </div>
          </div>
        </div>

        <!-- サーバー操作コントロール -->
        <div class="panel control-panel">
          <div class="panel-header">
            <h3>プロセス操作</h3>
          </div>
          <div class="panel-body control-actions">
            <button id="btn-server-restart" class="btn btn-primary">
              サーバー再起動
            </button>
            <button id="btn-server-stop" class="btn btn-danger">
              サーバー停止
            </button>
            <button id="btn-server-start" class="btn btn-success">
              サーバー起動
            </button>
            <button id="btn-nmt-restart" class="btn btn-warning">
              NMT 再起動
            </button>
          </div>
          <div id="control-message" class="alert hidden"></div>
        </div>
      </section>

      <!-- 2. ログ -->
      <section id="tab-logs" class="tab-content">
        <div class="panel logs-panel">
          <div class="panel-header logs-toolbar">
            <div class="toolbar-left">
              <span id="ws-status" class="status-indicator live">LIVE</span>
              <select id="log-level-filter" class="select-control">
                <option value="all">すべてのレベル</option>
                <option value="info">INFO</option>
                <option value="warn">WARN</option>
                <option value="error">ERROR</option>
              </select>
              <input type="text" id="log-search-input" class="input-control" placeholder="ログを検索...">
            </div>
            <div class="toolbar-right">
              <label class="checkbox-label">
                <input type="checkbox" id="log-autoscroll" checked> 自動スクロール
              </label>
              <button id="btn-clear-logs" class="btn btn-secondary btn-sm">ログ消去</button>
            </div>
          </div>
          <div id="terminal-logs" class="terminal-container">
            <div class="empty-state">ログを待機中...</div>
          </div>
        </div>
      </section>

      <!-- 3. エラー -->
      <section id="tab-errors" class="tab-content">
        <div class="panel">
          <div class="panel-header errors-toolbar">
            <div class="toolbar-left">
              <select id="error-status-filter" class="select-control">
                <option value="all">すべての状態</option>
                <option value="open" selected>未解決のみ</option>
                <option value="resolved">解決済み</option>
                <option value="ignored">無視</option>
              </select>
              <input type="text" id="error-search-input" class="input-control" placeholder="エラーを検索...">
            </div>
            <div class="toolbar-right">
              <button id="btn-clear-errors" class="btn btn-secondary btn-sm">全件消去</button>
              <button id="btn-refresh-errors" class="btn btn-secondary btn-sm">更新</button>
            </div>
          </div>
          <div id="errors-list" class="errors-container">
            <div class="empty-state">エラーはありません</div>
          </div>
        </div>
      </section>

      <!-- 4. 設定 -->
      <section id="tab-settings" class="tab-content">
        <div class="panel settings-panel">
          <div class="panel-header settings-toolbar">
            <div class="settings-tabs">
              <button class="subtab-btn active" data-subtab="env">.env 環境変数</button>
              <button class="subtab-btn" data-subtab="config">config.json 設定</button>
            </div>
            <div class="toolbar-right">
              <button id="btn-save-settings" class="btn btn-primary btn-sm">設定を保存</button>
            </div>
          </div>
          <div class="panel-body">
            <div id="subtab-env" class="subtab-content active">
              <div id="env-status" class="settings-file-status"></div>
              <textarea id="env-editor" class="code-editor" spellcheck="false" placeholder=".env の内容を読み込み中..."></textarea>
            </div>
            <div id="subtab-config" class="subtab-content">
              <div id="config-status" class="settings-file-status"></div>
              <textarea id="config-editor" class="code-editor" spellcheck="false" placeholder="config.json の内容を読み込み中..."></textarea>
            </div>
            <div id="settings-message" class="alert hidden"></div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="./app.js"></script>
</body>
</html>
